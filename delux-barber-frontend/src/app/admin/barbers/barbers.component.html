<div class="barbers-page">
  <div class="page-header">
    <div>
      <h1>Barbers</h1>
      <p class="text-muted">Manage your team of barbers.</p>
    </div>
    <button class="btn btn-gold" (click)="openCreate()">+ Add Barber</button>
  </div>

  <div *ngIf="loading" class="text-center"><div class="spinner"></div></div>

  <div class="barbers-grid" *ngIf="!loading">
    <div *ngIf="barbers.length === 0" class="text-muted text-center" style="padding:40px;grid-column:1/-1">
      No barbers found. Add your first barber.
    </div>
    <div class="barber-card" *ngFor="let b of barbers">
      <div class="barber-avatar">
        <img *ngIf="b.imageUrl" [src]="b.imageUrl" [alt]="b.firstName" />
        <div *ngIf="!b.imageUrl" class="avatar-placeholder">
          {{ b.firstName.charAt(0) }}{{ b.lastName.charAt(0) }}
        </div>
        <span class="status-dot" [class.active]="b.isActive" [title]="b.isActive ? 'Active' : 'Inactive'"></span>
      </div>
      <div class="barber-info">
        <h3>{{ b.firstName }} {{ b.lastName }}</h3>
        <p class="specialty text-gold" *ngIf="b.specialty">{{ b.specialty }}</p>
        <p class="bio text-muted" *ngIf="b.bio">{{ b.bio }}</p>
        <div class="barber-contact">
          <span *ngIf="b.email" class="contact-item">✉ {{ b.email }}</span>
          <span *ngIf="b.phone" class="contact-item">📞 {{ b.phone }}</span>
        </div>
      </div>
      <div class="barber-actions">
        <button class="btn btn-dark btn-sm" (click)="openEdit(b)">Edit</button>
        <button class="btn btn-danger btn-sm" (click)="delete(b)">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ editingId ? 'Edit Barber' : 'Add Barber' }}</h3>
      <button class="modal-close" (click)="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" [(ngModel)]="form.firstName" placeholder="First name" />
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" [(ngModel)]="form.lastName" placeholder="Last name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="form.email" placeholder="barber@delux.com" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" [(ngModel)]="form.phone" placeholder="+355 69 000 0000" />
        </div>
        <div class="form-group">
          <label>Specialty</label>
          <input type="text" [(ngModel)]="form.specialty" placeholder="e.g. Fade Specialist" />
        </div>
        <div class="form-group">
          <label>Image URL</label>
          <input type="url" [(ngModel)]="form.imageUrl" placeholder="https://..." />
        </div>
        <div class="form-group form-full">
          <label>Bio</label>
          <textarea [(ngModel)]="form.bio" placeholder="Short bio..."></textarea>
        </div>
        <div class="form-group form-full">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="form.isActive" style="width:auto;margin-right:8px" />
            Active (visible to customers)
          </label>
        </div>
      </div>
      <p *ngIf="error" class="error-msg">{{ error }}</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-dark" (click)="closeModal()">Cancel</button>
      <button class="btn btn-gold" (click)="save()" [disabled]="saving || !form.firstName || !form.lastName">
        {{ saving ? 'Saving...' : (editingId ? 'Save Changes' : 'Add Barber') }}
      </button>
    </div>
  </div>
</div>
