<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">✂</span>
      <span class="logo-text">DELUX</span>
    </div>
    <h2 class="login-title">Admin Panel</h2>
    <p class="login-sub">Sign in to manage your barbershop.</p>

    <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@deluxbarbershop.com"
          required
          autocomplete="email"
        />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <p *ngIf="error" class="login-error">{{ error }}</p>

      <button
        type="submit"
        class="btn btn-gold w-100"
        [disabled]="loading || !email || !password"
        style="justify-content:center; margin-top:8px"
      >
        <span *ngIf="loading">Signing in...</span>
        <span *ngIf="!loading">Sign In</span>
      </button>
    </form>

    <div class="login-footer">
      <a href="/" style="font-size:12px; color:var(--text-muted)">&#8592; Back to website</a>
    </div>
  </div>
</div>
